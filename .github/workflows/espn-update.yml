name: Update Volleys Cup from ESPN
on:
  schedule:
    # 13:20 UTC = 8:20 AM EST (Nov–Dec); scheduled jobs may run late.
    - cron: '20 13 * 11,12 2'
  workflow_dispatch:
    inputs:
      probe_only:
        description: 'Only test access and team matching; do not publish'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: espn-weekly-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch, validate, and update ESPN standings
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.probe_only }}" = "true" ]; then
            python scripts/update_espn.py --probe
          else
            python scripts/update_espn.py
          fi
      - name: Commit updated standings only when changed
        if: ${{ github.event_name == 'schedule' || inputs.probe_only == false }}
        run: |
          if git diff --quiet -- data/current.json; then
            echo 'No finalized new week; nothing to commit.'
            exit 0
          fi
          git config user.name 'volleys-cup-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/current.json
          git commit -m 'Update Volleys Cup from ESPN'
          git push
